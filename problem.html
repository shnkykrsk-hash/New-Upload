<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support — New Upload</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-nav"></div>
<main>
  <div class="wrap hero" style="padding-bottom:20px">
    <h1 style="font-size:clamp(30px,5vw,48px)">Need help?</h1>
    <p class="lead">Tell us what went wrong. If you paid, include your payment ID.</p>
  </div>
  <div class="wrap" style="max-width:640px;padding-bottom:60px">
    <div class="card">
      <label for="em" class="note">Your email</label>
      <input class="field" id="em" type="email" placeholder="you@example.com" style="margin:6px 0 14px">
      <label for="pid" class="note">Payment ID (optional)</label>
      <input class="field" id="pid" placeholder="pay_XXXXXXXX" style="margin:6px 0 14px">
      <label for="pm" class="note">What happened?</label>
      <textarea class="field" id="pm" style="margin:6px 0 14px" placeholder="Describe the problem..."></textarea>
      <button class="btn" id="send">Send message</button>
      <span class="msg" id="status"></span>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="app.js"></script>
<script>
document.getElementById("send").addEventListener("click",function(){
  var b=document.getElementById("send"),s=document.getElementById("status");
  var msg=document.getElementById("pm").value.trim();
  if(!msg){s.textContent=" Please describe the problem.";return;}
  b.disabled=true;
  fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg,email:document.getElementById("em").value.trim(),paymentId:document.getElementById("pid").value.trim(),type:"support"})})
  .then(function(r){if(!r.ok)throw 0;s.textContent=" Sent. We will get back to you.";document.getElementById("pm").value="";})
  .catch(function(){s.textContent=" Could not send right now. Please try again later.";})
  .then(function(){b.disabled=false;});
});
</script>
</body>
</html>
